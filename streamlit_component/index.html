<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato AI | Restaurant Recommender</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="hero-overlay"></div>
    <div class="container">
        <header>
            <div class="logo">
                <i data-lucide="utensils" class="logo-icon"></i>
                <h1>Zomato<span>AI Recommender</span></h1>
            </div>
            <h2>Craving something specific?</h2>
            <p>Let Zomato AI Recommender find the perfect table for your taste, mood, and budget.</p>
        </header>

        <main>
            <section class="search-card">
                <form id="recommendation-form">
                    <div class="form-group">
                        <label for="location"><i data-lucide="map-pin"></i> Location</label>
                        <select id="location" required>
                            <option value="" disabled selected>Select a location</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cuisine"><i data-lucide="chef-hat"></i> Cuisine (Optional)</label>
                        <input type="text" id="cuisine" placeholder="e.g., Italian, Chinese">
                    </div>
                    <div class="form-group">
                        <label for="min_rating"><i data-lucide="star"></i> Min Rating</label>
                        <div class="rating-slider-container">
                            <input type="range" id="min_rating" min="0" max="5" step="0.1" value="0.0" oninput="document.getElementById('rating-value').textContent = this.value">
                            <span id="rating-value" class="badge">0.0</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="max_budget"><i data-lucide="banknote"></i> Max Budget</label>
                        <input type="number" id="max_budget" min="0" placeholder="Enter budget in ₹" value="1000">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="extra_preferences"><i data-lucide="sparkles"></i> Extra Preferences (Optional)</label>
                        <input type="text" id="extra_preferences" placeholder="e.g., family-friendly, outdoor seating, quiet for dates">
                    </div>
                    <button type="submit" id="submit-btn">
                        <span>Find Places</span>
                        <i data-lucide="arrow-right"></i>
                    </button>
                </form>
            </section>

            <section class="results-section">
                <div id="results" class="results-grid"></div>
            </section>
        </main>
    </div>

    <script>
        // Streamlit messaging logic
        function sendToStreamlit(data) {
            window.parent.postMessage({
                type: 'streamlit:setComponentValue',
                value: data
            }, '*');
        }

        // Handle rendering from Streamlit
        window.addEventListener('message', (event) => {
            if (event.data.type === 'streamlit:render') {
                const args = event.data.args;
                
                // Populate locations if provided
                if (args.locations) {
                    const select = document.getElementById('location');
                    const currentValue = select.value;
                    select.innerHTML = '<option value="" disabled selected>Select a location</option>';
                    args.locations.forEach(loc => {
                        const option = document.createElement('option');
                        option.value = loc;
                        option.textContent = loc;
                        if (loc === currentValue || loc === args.selected_location) {
                            option.selected = true;
                        }
                        select.appendChild(option);
                    });
                }
                
                // Render results if provided
                if (args.results) {
                    const resultsContainer = document.getElementById('results');
                    const submitBtn = document.getElementById('submit-btn');
                    const btnText = submitBtn.querySelector('span');
                    
                    btnText.textContent = 'Find Places';
                    submitBtn.disabled = false;
                    
                    if (args.results.error) {
                        resultsContainer.innerHTML = `<div class="error-message"><h3>Error</h3><p>${args.results.error}</p></div>`;
                    } else if (args.results.length === 0) {
                        resultsContainer.innerHTML = `<div class="info-message"><h3>No recommendations found</h3></div>`;
                    } else {
                        let html = '';
                        args.results.forEach((restaurant, index) => {
                            html += `
                                <div class="restaurant-card">
                                    <div class="card-header">
                                        <div class="card-title">
                                            <h3>${restaurant.name}</h3>
                                            <p>${restaurant.cuisines.join(', ')}</p>
                                        </div>
                                        <div class="rating-badge">
                                            <i data-lucide="star" style="width: 14px; height: 14px; fill: currentColor"></i>
                                            ${restaurant.rating.toFixed(1)}
                                        </div>
                                    </div>
                                    <div class="card-stats">
                                        <div class="stat">
                                            <i data-lucide="map-pin"></i>
                                            <span>${restaurant.location}</span>
                                        </div>
                                        <div class="stat">
                                            <i data-lucide="banknote"></i>
                                            <span>₹${restaurant.cost_for_two} for two</span>
                                        </div>
                                        <div class="stat">
                                            <i data-lucide="users"></i>
                                            <span>${restaurant.votes} votes</span>
                                        </div>
                                    </div>
                                    <div class="explanation">
                                        <strong>AI Analysis</strong>
                                        ${restaurant.explanation}
                                    </div>
                                </div>
                            `;
                        });
                        resultsContainer.innerHTML = html;
                    }
                    if (window.lucide) window.lucide.createIcons();
                }
            }
        });

        // Form submission
        document.getElementById('recommendation-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const location = document.getElementById('location').value;
            const cuisine = document.getElementById('cuisine').value || null;
            const min_rating = parseFloat(document.getElementById('min_rating').value);
            const max_budget = parseFloat(document.getElementById('max_budget').value);
            const extra_preferences = document.getElementById('extra_preferences').value || null;
            
            sendToStreamlit({
                location,
                cuisine,
                min_rating,
                max_budget,
                extra_preferences
            });
        });

        // Signal that the component is ready
        window.parent.postMessage({
            type: 'streamlit:componentReady',
            apiVersion: 1
        }, '*');
        
        lucide.createIcons();
    </script>
</body>
</html>
